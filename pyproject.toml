[project]
name = "doodledex-ml"
version = "0.1.0"
description = "Training, evaluation and parity-fixture pipeline for the DoodleDex iOS app"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.8.6"]
train = ["torch==2.7.0", "coremltools==9.0", "matplotlib==3.10.0", "pillow==11.1.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/doodledex_ml"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
